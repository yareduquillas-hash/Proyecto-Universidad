<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Actividades - Inicio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-placeholder">
            <img id="img-logo" src="img-logo.png" alt="[ Logo de la Escuela ]">
        </div>
        <h1>Gestor de Actividades</h1>
    </header>

   <nav class="main-nav">
        <a href="index.html" class="btn-login">Inicio</a>
    </nav>

    <main class="login-area">
        <div class="login-card">
            <h2 class="login-title">Acceso al Sistema</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="rol">Ingresar como:</label>
                    <select id="rol" class="login-input select-rol" required>
                        <option value="" disabled selected>Selecciona tu rol...</option>
                        <option value="profesor">Director / Profesor</option>
                        <option value="estudiante">Integrante / Estudiante</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" class="login-input" placeholder="Nombre de usuario" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="login-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html
